name: Build GEMINos Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - '**.zip'
      - '**/*.gradle'
      - '**/*.properties'
      - '**/*.java'
      - '**/*.html'

permissions:
  contents: read

jobs:
  build:
    name: Compile GEMINos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Locate GEMINos archive
        run: |
          ARCHIVE=$(find . -type f -name "GEMINos_Android_7_1_1_Vault_Update_Functional_Source.zip" -not -path "./.git/*" -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: GEMINos ZIP archive not found in repository."
            exit 1
          fi

          echo "Found archive: $ARCHIVE"
          echo "GEMINOS_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/geminos"
          unzip -q "$GEMINOS_ARCHIVE" -d "$RUNNER_TEMP/geminos"

          PROJECT_DIR=$(find "$RUNNER_TEMP/geminos" -name "settings.gradle" -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project files
        run: |
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/premiumcorp/geminos/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Build GEMINos APK
        run: |
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Upload GEMINos APK
        uses: actions/upload-artifact@v4
        with:
          name: GEMINos-Android-7.1.1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
        with:
          name: GEMINos-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
